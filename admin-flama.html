<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin | Flama Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070608;
      --surface: #121013;
      --surface-2: #1b171c;
      --rojo: #e51a24;
      --rojo-brillo: #ff3b45;
      --borde: rgba(255, 255, 255, 0.10);
      --texto: #f6f4f7;
      --sec: #9e969e;
      --verde: #1fba58;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--texto);
      min-height: 100vh;
      padding-bottom: 70px;
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(229, 26, 36, 0.25), transparent 70%),
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 42px 42px, 42px 42px;
    }

    /* LOGIN */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card {
      background: var(--surface); border: 1px solid rgba(229, 26, 36, 0.45);
      width: 100%; max-width: 410px; border-radius: 20px; padding: 28px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.7);
    }
    .login-badge {
      display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--rojo-brillo); background: rgba(229, 26, 36, 0.14); border: 1px solid rgba(229, 26, 36, 0.35);
      padding: 4px 12px; border-radius: 999px; margin-bottom: 10px;
    }
    .login-card h1 { font-family: 'Anton', sans-serif; font-size: 32px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
    .login-card p { color: var(--sec); font-size: 13.5px; margin-bottom: 18px; }
    .demo-banner {
      background: rgba(245, 158, 11, 0.14); border: 1px solid rgba(245, 158, 11, 0.4); color: #fcd34d;
      padding: 10px 12px; border-radius: 12px; font-size: 13px; margin-bottom: 16px; line-height: 1.45;
    }

    /* TOPBAR */
    .topbar {
      background: rgba(7, 6, 8, 0.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--borde); padding: 12px 16px; position: sticky; top: 0; z-index: 30;
    }
    .topbar-inner { max-width: 960px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .topbar h1 { font-family: 'Anton', sans-serif; font-size: 22px; letter-spacing: 1px; text-transform: uppercase; color: #fff; }
    .topbar h1 em { font-style: normal; color: var(--rojo-brillo); }
    .top-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-sm {
      border: 1px solid var(--borde); border-radius: 10px; padding: 8px 12px; font-size: 12.5px;
      font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
      background: var(--surface-2); color: #fff; font-family: inherit;
    }
    .btn-view { background: var(--rojo); border-color: var(--rojo); }

    .wrap { max-width: 960px; margin: 0 auto; padding: 18px 16px; }

    /* ESTADO TIENDA */
    .status-box { background: var(--surface); border: 1px solid var(--borde); border-radius: 16px; padding: 14px; margin-bottom: 16px; }
    .status-box h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--sec); margin-bottom: 10px; }
    .estado-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    @media (max-width: 550px) { .estado-grid { grid-template-columns: 1fr; } }
    .estado-btn {
      padding: 11px; border: 1px solid var(--borde); border-radius: 12px; background: var(--surface-2);
      color: #ddd; font-weight: 700; font-size: 13.5px; cursor: pointer; font-family: inherit;
    }
    .estado-btn.active { background: var(--rojo); border-color: var(--rojo); color: #fff; }

    /* PESTAÑAS */
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
    .tab-btn {
      padding: 12px 8px; border-radius: 12px; border: 1px solid var(--borde); background: var(--surface);
      color: var(--sec); font-weight: 700; font-size: 13.5px; cursor: pointer; font-family: inherit;
    }
    .tab-btn.active { background: var(--rojo); color: #fff; border-color: var(--rojo); }

    .panel-sec { display: none; }
    .panel-sec.active { display: block; }

    .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .toolbar input, .toolbar select {
      padding: 11px 12px; border: 1px solid var(--borde); border-radius: 12px; font-size: 14px;
      background: var(--surface); color: #fff; flex: 1; min-width: 150px; font-family: inherit; outline: none;
    }
    .btn-add { background: var(--verde); color: #fff; border: none; border-radius: 12px; padding: 12px 18px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; }

    /* LISTA PRODUCTOS */
    .prod-item {
      background: var(--surface); border: 1px solid var(--borde); border-radius: 16px; padding: 12px;
      display: flex; gap: 12px; align-items: center; margin-bottom: 10px; flex-wrap: wrap;
    }
    .prod-item.sin-stock { opacity: 0.55; }
    .thumb {
      width: 64px; height: 64px; border-radius: 12px; background: #09080a; border: 1px solid var(--borde);
      display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; font-size: 26px;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .prod-info { flex: 1; min-width: 180px; }
    .prod-info h4 { font-size: 16px; font-weight: 700; color: #fff; }
    .prod-meta { font-size: 12.5px; color: var(--sec); margin-top: 2px; }
    .prod-price { font-size: 16.5px; font-weight: 700; color: var(--rojo-brillo); margin-top: 4px; }
    .prod-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .act-btn { border: 1px solid var(--borde); background: var(--surface-2); color: #fff; border-radius: 10px; padding: 8px 10px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .act-btn.stock-on { background: rgba(31, 186, 88, 0.16); border-color: rgba(31, 186, 88, 0.45); color: #6ee7b7; }
    .act-btn.stock-off { background: rgba(229, 26, 36, 0.18); border-color: rgba(229, 26, 36, 0.45); color: #fca5a5; }
    .act-btn.promo-on { background: rgba(245, 158, 11, 0.2); border-color: rgba(245, 158, 11, 0.5); color: #fcd34d; }
    .act-btn.del { color: #fca5a5; }

    /* FORMULARIOS */
    .card-box { background: var(--surface); border: 1px solid var(--borde); border-radius: 16px; padding: 18px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 5px; color: var(--sec); }
    .field input, .field textarea, .field select {
      width: 100%; padding: 11px 12px; border: 1px solid var(--borde); border-radius: 10px;
      font-size: 14px; font-family: inherit; background: #070608; color: #fff; outline: none;
    }
    .field input:focus, .field textarea:focus { border-color: var(--rojo); }
    .btn-primary { width: 100%; padding: 14px; background: var(--rojo); color: #fff; border: none; border-radius: 12px; font-size: 15.5px; font-weight: 700; cursor: pointer; font-family: inherit; }

    .upload-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
    .btn-upload { background: var(--surface-2); color: #fff; border: 1px solid var(--rojo); padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .preview-mini { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; border: 1px solid var(--borde); display: none; }
    .switch-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #09080a; border: 1px solid var(--borde); border-radius: 10px; margin-bottom: 10px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
    .switch-row input { width: 19px; height: 19px; accent-color: var(--rojo); }

    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-bg.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--borde); width: 100%; max-width: 500px; max-height: 92vh; overflow-y: auto; border-radius: 20px; padding: 22px; position: relative; }
    .modal-close { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--surface-2); color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--verde); color: #fff;
      padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 14px; display: none; z-index: 200;
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
    }
  </style>
</head>
<body>

  <!-- LOGIN EXCLUSIVO DE FLAMA -->
  <div class="login-wrap" id="loginScreen">
    <div class="login-card">
      <span class="login-badge">🔥 Acceso Privado</span>
      <h1>FLAMA TIENDA</h1>
      <p>Ingresá con tu correo y contraseña para administrar perfumes, precios, stock y fotos.</p>
      <div class="demo-banner" id="demoBanner" style="display:none;">
        🧪 <strong>MODO PRUEBA LOCAL</strong><br>Correo: <strong id="demoEmailTxt"></strong> · Clave: <strong id="demoPassTxt"></strong>
      </div>
      <form id="loginForm">
        <div class="field"><label>Correo electrónico</label><input type="email" id="lEmail" required placeholder="flama@gmail.com" /></div>
        <div class="field"><label>Contraseña</label><input type="password" id="lPass" required placeholder="••••••••" /></div>
        <p id="loginErr" style="color:var(--rojo-brillo); font-size:13px; font-weight:700; margin-bottom:10px; display:none;"></p>
        <button type="submit" class="btn-primary" id="btnLogin">Ingresar al Panel</button>
      </form>
    </div>
  </div>

  <!-- PANEL -->
  <div id="adminScreen" style="display:none;">
    <header class="topbar">
      <div class="topbar-inner">
        <h1 id="admStoreTitle">FLAMA TIENDA · <em>ADMIN</em></h1>
        <div class="top-btns">
          <button class="btn-sm btn-copy" id="btnCopyLink">🔗 Copiar Link</button>
          <a href="tienda.html" target="_blank" class="btn-sm btn-view" id="btnViewCat">👁️ Ver Tienda</a>
          <button class="btn-sm" id="btnLogout">Salir</button>
        </div>
      </div>
    </header>

    <div class="wrap">
      <div class="demo-banner" id="demoTopWarn" style="display:none;">🧪 Estás en Modo Prueba local.</div>

      <div class="status-box">
        <h3>Estado de la tienda</h3>
        <div class="estado-grid">
          <button class="estado-btn" data-estado="abierto">🟢 Tienda Activa</button>
          <button class="estado-btn" data-estado="cerrado">🔴 Pausada temporalmente</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="tabProds">💎 Productos</button>
        <button class="tab-btn" data-tab="tabCats">📂 Categorías</button>
        <button class="tab-btn" data-tab="tabInfo">🏪 Datos de Flama</button>
      </div>

      <section class="panel-sec active" id="tabProds">
        <div class="toolbar">
          <input type="text" id="admSearch" placeholder="🔍 Buscar perfume o prenda..." />
          <select id="admFilterCat"><option value="todas">Todas las categorías</option></select>
          <button class="btn-add" id="btnNewProd">+ Nuevo Producto</button>
        </div>
        <div id="prodList"></div>
      </section>

      <section class="panel-sec" id="tabCats">
        <div class="toolbar"><button class="btn-add" id="btnNewCat">+ Nueva Categoría</button></div>
        <div id="catList"></div>
      </section>

      <section class="panel-sec" id="tabInfo">
        <div class="card-box">
          <div class="field"><label>Nombre de la tienda</label><input id="nNombre" /></div>
          <div class="field"><label>Subtítulo</label><input id="nSubtitulo" /></div>
          <div class="field">
            <label>Logo de Flama</label>
            <input id="nLogo" placeholder="Se completa al subir foto" />
            <div class="upload-box">
              <label class="btn-upload">📸 Subir Logo<input type="file" id="nLogoFile" accept="image/*" hidden /></label>
              <img id="nLogoPrev" class="preview-mini" />
            </div>
          </div>
          <div class="field">
            <label>Imagen de Portada</label>
            <input id="nBanner" placeholder="Se completa al subir foto" />
            <div class="upload-box">
              <label class="btn-upload">🖼️ Subir Portada<input type="file" id="nBannerFile" accept="image/*" hidden /></label>
              <img id="nBannerPrev" class="preview-mini" />
            </div>
          </div>
          <div class="field"><label>WhatsApp (549 + número sin espacios)</label><input id="nWa" placeholder="5491135093735" /></div>
          <div class="field"><label>Teléfono visible</label><input id="nTelVis" placeholder="11 3509-3735" /></div>
          <div class="field"><label>Zona / Ubicación</label><input id="nDir" placeholder="Caseros, Tres de Febrero" /></div>
          <div class="field"><label>Instagram (sin @)</label><input id="nIg" placeholder="tiendaflama__" /></div>
          <div class="field"><label>Texto de envíos</label><input id="nEnvio" placeholder="Envíos y Retiros en Caseros" /></div>
          <div class="field"><label>Frase destacada (cinta superior)</label><input id="nHorTxt" /></div>
          <button class="btn-primary" id="btnSaveInfo">💾 Guardar Datos de Flama</button>
        </div>
      </section>
    </div>
  </div>

  <!-- MODAL PRODUCTO -->
  <div class="modal-bg" id="mProd">
    <div class="modal">
      <button class="modal-close" data-close="mProd">×</button>
      <h2 id="mpTitle" style="font-family:'Anton',sans-serif; font-size:26px; margin-bottom:14px;">PRODUCTO</h2>
      <div class="field"><label>Categoría *</label><select id="pCat"></select></div>
      <div class="field"><label>Nombre *</label><input id="pNombre" placeholder="Ej: Lattafa Khamrah" /></div>
      <div class="field"><label>Precio (solo números, sin puntos ni $) *</label><input type="number" id="pPrecio" placeholder="50000" /></div>
      <div class="field"><label>Descripción</label><textarea id="pDesc" rows="2" placeholder="Ej: Lattafa · 100 ml"></textarea></div>
      <div class="field">
        <label>Foto del producto</label>
        <input id="pFoto" placeholder="Se completa sola al subir foto" />
        <div class="upload-box">
          <label class="btn-upload">📸 Elegir foto de galería / cámara<input type="file" id="pFotoFile" accept="image/*" hidden /></label>
          <img id="pFotoPrev" class="preview-mini" />
          <span id="pUpStatus" style="font-size:12.5px; color:var(--sec);"></span>
        </div>
      </div>
      <div class="field"><label>Texto guía opcional (ej: talle o si es para regalo)</label><input id="pNota" /></div>
      <label class="switch-row"><input type="checkbox" id="pStock" checked /> ✅ En Stock (visible en la tienda)</label>
      <label class="switch-row"><input type="checkbox" id="pPromo" /> 🔥 Destacar como Oferta</label>
      <button class="btn-primary" id="btnSaveProd">💾 Guardar Producto</button>
    </div>
  </div>

  <!-- MODAL CATEGORÍA -->
  <div class="modal-bg" id="mCat">
    <div class="modal">
      <button class="modal-close" data-close="mCat">×</button>
      <h2 id="mcTitle" style="font-family:'Anton',sans-serif; font-size:26px; margin-bottom:14px;">CATEGORÍA</h2>
      <div class="field"><label>Nombre *</label><input id="cNombre" placeholder="Ej: PERFUMES HOMBRE" /></div>
      <div class="field"><label>Icono (emoji)</label><input id="cIcono" placeholder="💎" value="💎" /></div>
      <button class="btn-primary" id="btnSaveCat">💾 Guardar Categoría</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="flama-data.js"></script>
  <script type="module">
    const CFG = window.APP_CONFIG || {};
    const TIENDA_ID = "flama"; // 100% exclusivo para Flama Tienda
    const DEMO_MODE = !CFG.FIREBASE_CONFIG || !CFG.FIREBASE_CONFIG.apiKey || CFG.FIREBASE_CONFIG.apiKey === "PEGAR_AQUI";
    const CLOUD_DEMO = !CFG.CLOUDINARY_CLOUD_NAME || CFG.CLOUDINARY_CLOUD_NAME === "PEGAR_AQUI";
    const DEMO_EMAIL = CFG.DEMO_EMAIL || "demo@alaromana.com";
    const DEMO_PASS = CFG.DEMO_PASS || "1234";

    let auth = null, db = null, fbAuthMod = null, fbDbMod = null;
    if (!DEMO_MODE) {
      try {
        const fbApp = await import("https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js");
        fbAuthMod = await import("https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js");
        fbDbMod = await import("https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js");
        const app = fbApp.initializeApp(CFG.FIREBASE_CONFIG);
        auth = fbAuthMod.getAuth(app);
        db = fbDbMod.getFirestore(app);
      } catch (err) { alert("No se pudo conectar con Firebase: " + err.message); }
    }

    let DATA = null, currentUid = "demo", editProdIdx = -1, editCatIdx = -1;
    const fmt = (n) => "$" + Number(n || 0).toLocaleString("es-AR");

    function showToast(txt, isErr = false) {
      const t = document.getElementById("toast");
      t.textContent = txt; t.style.background = isErr ? "#b91c1c" : "#1fba58";
      t.style.display = "block";
      clearTimeout(window._tt);
      window._tt = setTimeout(() => { t.style.display = "none"; }, 2600);
    }

    function obtenerBaseFlama(ownerUid = "demo") {
      const base = (window.PRESET_STORES && window.PRESET_STORES["flama"]) || {
        negocio: { tipo: "tienda", nombre: "FLAMA TIENDA", subtitulo: "Perfumes Importados & Pilchas", estadoModo: "abierto" },
        categorias: [{ id: "unisex", nombre: "PERFUMES UNISEX", icono: "💎" }],
        productos: []
      };
      const copia = JSON.parse(JSON.stringify(base));
      copia.ownerUid = ownerUid;
      return copia;
    }

    async function guardarEnNube(msg = "✅ ¡Guardado en Flama Tienda!") {
      if (DEMO_MODE) {
        try { localStorage.setItem("demo_tienda_flama", JSON.stringify(DATA)); showToast(msg); }
        catch { showToast("❌ Demasiado pesado para el modo prueba local.", true); }
        return;
      }
      try { await fbDbMod.setDoc(fbDbMod.doc(db, "tiendas", TIENDA_ID), DATA); showToast(msg); }
      catch { showToast("❌ Error al guardar. Verificá tu cuenta.", true); }
    }

    function comprimirImagen(file, maxW = 900, quality = 0.78, asDataUrl = false) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxW / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            if (asDataUrl) resolve(canvas.toDataURL("image/jpeg", quality));
            else canvas.toBlob(blob => resolve(blob), "image/jpeg", quality);
          };
          img.onerror = reject; img.src = e.target.result;
        };
        reader.onerror = reject; reader.readAsDataURL(file);
      });
    }

    async function subirFoto(file, maxW = 700) {
      if (CLOUD_DEMO) return await comprimirImagen(file, 500, 0.7, true);
      const blob = await comprimirImagen(file, maxW, 0.78, false);
      const fd = new FormData(); fd.append("file", blob, "foto.jpg"); fd.append("upload_preset", CFG.CLOUDINARY_UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CFG.CLOUDINARY_CLOUD_NAME}/image/upload`, { method: "POST", body: fd });
      const json = await res.json();
      if (!json.secure_url) throw new Error(json.error?.message || "Error subiendo foto");
      return json.secure_url;
    }

    function entrarAlPanel() {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("adminScreen").style.display = "block";
      if (DEMO_MODE) document.getElementById("demoTopWarn").style.display = "block";
      renderTodo();
    }

    function leerLocalSeguro() {
      try { const r = localStorage.getItem("demo_tienda_flama"); return r ? JSON.parse(r) : null; }
      catch { return null; }
    }

    if (DEMO_MODE) {
      document.getElementById("demoBanner").style.display = "block";
      document.getElementById("demoEmailTxt").textContent = DEMO_EMAIL;
      document.getElementById("demoPassTxt").textContent = DEMO_PASS;
      document.getElementById("lEmail").value = DEMO_EMAIL;
      document.getElementById("lPass").value = DEMO_PASS;
      if (sessionStorage.getItem("demo_logged_flama") === "1") {
        DATA = leerLocalSeguro() || obtenerBaseFlama();
        entrarAlPanel();
      }
    } else if (auth) {
      fbAuthMod.onAuthStateChanged(auth, async (user) => {
        if (!user) {
          document.getElementById("loginScreen").style.display = "flex";
          document.getElementById("adminScreen").style.display = "none";
          return;
        }
        currentUid = user.uid;
        const ref = fbDbMod.doc(db, "tiendas", TIENDA_ID);
        const snap = await fbDbMod.getDoc(ref);
        if (snap.exists()) {
          const d = snap.data();
          if (d.ownerUid && d.ownerUid !== user.uid) {
            alert("Esta cuenta no tiene permiso para editar Flama Tienda. Iniciá sesión con el correo de Flama.");
            await fbAuthMod.signOut(auth);
            return;
          }
          DATA = d;
        } else {
          DATA = obtenerBaseFlama(user.uid);
          await fbDbMod.setDoc(ref, DATA);
          showToast("🎉 ¡Catálogo de Flama creado!");
        }
        entrarAlPanel();
      });
    }

    document.getElementById("loginForm").onsubmit = async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("loginErr"); errEl.style.display = "none";
      const email = document.getElementById("lEmail").value.trim();
      const pass = document.getElementById("lPass").value;
      if (DEMO_MODE) {
        if (email === DEMO_EMAIL && pass === DEMO_PASS) {
          sessionStorage.setItem("demo_logged_flama", "1");
          DATA = leerLocalSeguro() || obtenerBaseFlama();
          localStorage.setItem("demo_tienda_flama", JSON.stringify(DATA));
          entrarAlPanel();
        } else { errEl.textContent = "Correo o contraseña incorrectos."; errEl.style.display = "block"; }
        return;
      }
      const btn = document.getElementById("btnLogin"); btn.textContent = "Ingresando...";
      try { await fbAuthMod.signInWithEmailAndPassword(auth, email, pass); }
      catch { errEl.textContent = "Correo o contraseña incorrectos."; errEl.style.display = "block"; }
      btn.textContent = "Ingresar al Panel";
    };

    document.getElementById("btnLogout").onclick = () => {
      if (DEMO_MODE) { sessionStorage.removeItem("demo_logged_flama"); location.reload(); }
      else fbAuthMod.signOut(auth);
    };

    document.getElementById("btnCopyLink").onclick = async () => {
      const base = window.location.href.split("admin-flama.html")[0];
      const link = `${base}tienda.html?t=flama`;
      try { await navigator.clipboard.writeText(link); showToast("🔗 Link de Flama copiado"); }
      catch { prompt("Copiá el link de Flama Tienda:", link); }
    };

    function renderTodo() {
      document.getElementById("admStoreTitle").innerHTML = `${DATA.negocio?.nombre || "FLAMA TIENDA"} · <em>ADMIN</em>`;
      const modo = DATA.negocio?.estadoModo === "cerrado" ? "cerrado" : "abierto";
      document.querySelectorAll(".estado-btn").forEach(b => b.classList.toggle("active", b.dataset.estado === modo));
      renderFilterCats(); renderProds(); renderCats(); cargarFormNegocio();
    }

    function renderFilterCats() {
      const sel = document.getElementById("admFilterCat"); const val = sel.value;
      sel.innerHTML = `<option value="todas">Todas las categorías</option>`;
      (DATA.categorias || []).forEach(c => { const o = document.createElement("option"); o.value = c.id; o.textContent = `${c.icono ? c.icono + " " : ""}${c.nombre}`; sel.appendChild(o); });
      sel.value = val || "todas";
    }

    function renderProds() {
      const box = document.getElementById("prodList"); box.innerHTML = "";
      const q = document.getElementById("admSearch").value.trim().toLowerCase();
      const fCat = document.getElementById("admFilterCat").value;
      const catMap = Object.fromEntries((DATA.categorias || []).map(c => [c.id, c.nombre]));

      (DATA.productos || []).forEach((p, idx) => {
        if (fCat !== "todas" && p.categoriaId !== fCat) return;
        if (q && !(p.nombre || "").toLowerCase().includes(q)) return;
        const enStock = p.disponible !== false;
        const item = document.createElement("div"); item.className = "prod-item" + (enStock ? "" : " sin-stock");
        const thumb = document.createElement("div"); thumb.className = "thumb";
        if (p.foto) { const img = document.createElement("img"); img.src = p.foto; img.onerror = () => { thumb.textContent = p.icono || "💎"; }; thumb.appendChild(img); }
        else thumb.textContent = p.icono || "💎";

        const info = document.createElement("div"); info.className = "prod-info";
        const h4 = document.createElement("h4"); h4.textContent = p.nombre;
        const meta = document.createElement("div"); meta.className = "prod-meta"; meta.textContent = `${catMap[p.categoriaId] || ""} ${enStock ? "" : "· 🚫 SIN STOCK (Oculto)"}`;
        const pr = document.createElement("div"); pr.className = "prod-price"; pr.textContent = fmt(p.precio);
        info.appendChild(h4); info.appendChild(meta); info.appendChild(pr);

        const acts = document.createElement("div"); acts.className = "prod-actions";
        const bStock = document.createElement("button"); bStock.className = "act-btn " + (enStock ? "stock-on" : "stock-off");
        bStock.textContent = enStock ? "✅ Con Stock" : "🚫 Sin Stock";
        bStock.onclick = async () => { DATA.productos[idx].disponible = !enStock; renderProds(); await guardarEnNube(enStock ? "Ocultado (Sin stock)" : "Visible (Con stock)"); };

        const bPromo = document.createElement("button"); bPromo.className = "act-btn " + (p.esPromo ? "promo-on" : "");
        bPromo.textContent = p.esPromo ? "🔥 Oferta" : "Oferta";
        bPromo.onclick = async () => { DATA.productos[idx].esPromo = !p.esPromo; renderProds(); await guardarEnNube(); };

        const bEdit = document.createElement("button"); bEdit.className = "act-btn"; bEdit.textContent = "✏️ Editar";
        bEdit.onclick = () => abrirModalProd(idx);

        const bDel = document.createElement("button"); bDel.className = "act-btn del"; bDel.textContent = "🗑️";
        bDel.onclick = async () => { if (!confirm(`¿Seguro querés borrar "${p.nombre}"?`)) return; DATA.productos.splice(idx, 1); renderProds(); await guardarEnNube("🗑️ Producto eliminado"); };

        acts.appendChild(bStock); acts.appendChild(bPromo); acts.appendChild(bEdit); acts.appendChild(bDel);
        item.appendChild(thumb); item.appendChild(info); item.appendChild(acts); box.appendChild(item);
      });
    }

    function abrirModalProd(idx = -1) {
      editProdIdx = idx;
      const sel = document.getElementById("pCat"); sel.innerHTML = "";
      (DATA.categorias || []).forEach(c => { const o = document.createElement("option"); o.value = c.id; o.textContent = `${c.icono ? c.icono + " " : ""}${c.nombre}`; sel.appendChild(o); });
      const prev = document.getElementById("pFotoPrev"); document.getElementById("pUpStatus").textContent = "";
      if (idx === -1) {
        document.getElementById("mpTitle").textContent = "NUEVO PRODUCTO";
        document.getElementById("pNombre").value = ""; document.getElementById("pPrecio").value = ""; document.getElementById("pDesc").value = "";
        document.getElementById("pFoto").value = ""; document.getElementById("pNota").value = "";
        document.getElementById("pStock").checked = true; document.getElementById("pPromo").checked = false; prev.style.display = "none";
      } else {
        const p = DATA.productos[idx];
        document.getElementById("mpTitle").textContent = "EDITAR PRODUCTO"; sel.value = p.categoriaId;
        document.getElementById("pNombre").value = p.nombre || ""; document.getElementById("pPrecio").value = p.precio || "";
        document.getElementById("pDesc").value = p.descripcion || ""; document.getElementById("pFoto").value = p.foto || "";
        document.getElementById("pNota").value = p.ejemploNota || "";
        document.getElementById("pStock").checked = p.disponible !== false; document.getElementById("pPromo").checked = Boolean(p.esPromo);
        if (p.foto) { prev.src = p.foto; prev.style.display = "block"; } else prev.style.display = "none";
      }
      document.getElementById("mProd").classList.add("open");
    }

    document.getElementById("btnNewProd").onclick = () => {
      if (!DATA.categorias || DATA.categorias.length === 0) return alert("Primero creá al menos una categoría.");
      abrirModalProd(-1);
    };
    document.getElementById("pFotoFile").onchange = async (e) => {
      const file = e.target.files[0]; if (!file) return;
      const st = document.getElementById("pUpStatus"); st.textContent = "⏳ Subiendo foto...";
      try {
        const url = await subirFoto(file, 700);
        document.getElementById("pFoto").value = url;
        const prev = document.getElementById("pFotoPrev"); prev.src = url; prev.style.display = "block";
        st.textContent = "✅ Foto lista";
      } catch (err) { st.textContent = "❌ " + err.message; }
    };
    document.getElementById("btnSaveProd").onclick = async () => {
      const nombre = document.getElementById("pNombre").value.trim();
      const precio = Number(document.getElementById("pPrecio").value);
      if (!nombre || !precio) return alert("Completá el nombre y el precio.");
      const obj = {
        categoriaId: document.getElementById("pCat").value, nombre, precio,
        descripcion: document.getElementById("pDesc").value.trim(), foto: document.getElementById("pFoto").value.trim(),
        icono: "💎", ejemploNota: document.getElementById("pNota").value.trim(),
        disponible: document.getElementById("pStock").checked, esPromo: document.getElementById("pPromo").checked
      };
      if (editProdIdx === -1) DATA.productos.push(obj); else DATA.productos[editProdIdx] = obj;
      document.getElementById("mProd").classList.remove("open"); renderProds(); await guardarEnNube();
    };

    function renderCats() {
      const box = document.getElementById("catList"); box.innerHTML = "";
      (DATA.categorias || []).forEach((c, idx) => {
        const item = document.createElement("div"); item.className = "prod-item";
        const info = document.createElement("div"); info.className = "prod-info";
        const h4 = document.createElement("h4"); h4.textContent = `${c.icono ? c.icono + " " : ""}${c.nombre}`; info.appendChild(h4);
        const acts = document.createElement("div"); acts.className = "prod-actions";
        const bUp = document.createElement("button"); bUp.className = "act-btn"; bUp.textContent = "⬆️";
        bUp.onclick = async () => { if (idx === 0) return; [DATA.categorias[idx-1], DATA.categorias[idx]] = [DATA.categorias[idx], DATA.categorias[idx-1]]; renderTodo(); await guardarEnNube(); };
        const bEdit = document.createElement("button"); bEdit.className = "act-btn"; bEdit.textContent = "✏️ Editar";
        bEdit.onclick = () => { editCatIdx = idx; document.getElementById("mcTitle").textContent = "EDITAR CATEGORÍA"; document.getElementById("cNombre").value = c.nombre; document.getElementById("cIcono").value = c.icono || "💎"; document.getElementById("mCat").classList.add("open"); };
        const bDel = document.createElement("button"); bDel.className = "act-btn del"; bDel.textContent = "🗑️";
        bDel.onclick = async () => {
          if ((DATA.productos || []).some(p => p.categoriaId === c.id)) return alert("Borrá o mové primero los productos de esta categoría.");
          if (!confirm(`¿Borrar la categoría "${c.nombre}"?`)) return;
          DATA.categorias.splice(idx, 1); renderTodo(); await guardarEnNube();
        };
        acts.appendChild(bUp); acts.appendChild(bEdit); acts.appendChild(bDel);
        item.appendChild(info); item.appendChild(acts); box.appendChild(item);
      });
    }

    document.getElementById("btnNewCat").onclick = () => { editCatIdx = -1; document.getElementById("mcTitle").textContent = "NUEVA CATEGORÍA"; document.getElementById("cNombre").value = ""; document.getElementById("cIcono").value = "💎"; document.getElementById("mCat").classList.add("open"); };
    document.getElementById("btnSaveCat").onclick = async () => {
      const nombre = document.getElementById("cNombre").value.trim(); const icono = document.getElementById("cIcono").value.trim() || "💎";
      if (!nombre) return alert("Escribí un nombre.");
      if (editCatIdx === -1) {
        const id = nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-") + "-" + Date.now().toString().slice(-3);
        DATA.categorias.push({ id, nombre, icono });
      } else { DATA.categorias[editCatIdx].nombre = nombre; DATA.categorias[editCatIdx].icono = icono; }
      document.getElementById("mCat").classList.remove("open"); renderTodo(); await guardarEnNube();
    };

    function cargarFormNegocio() {
      const n = DATA.negocio || {};
      document.getElementById("nNombre").value = n.nombre || ""; document.getElementById("nSubtitulo").value = n.subtitulo || "";
      document.getElementById("nLogo").value = n.logo || "";
      const prev = document.getElementById("nLogoPrev");
      if (n.logo) { prev.src = n.logo; prev.style.display = "block"; } else prev.style.display = "none";
      document.getElementById("nBanner").value = n.banner || "";
      const bPrev = document.getElementById("nBannerPrev");
      if (n.banner) { bPrev.src = n.banner; bPrev.style.display = "block"; } else bPrev.style.display = "none";
      document.getElementById("nWa").value = n.whatsapp || ""; document.getElementById("nTelVis").value = n.telefonoVisible || "";
      document.getElementById("nDir").value = n.direccion || ""; document.getElementById("nIg").value = n.instagram || "";
      document.getElementById("nEnvio").value = n.envioTexto || ""; document.getElementById("nHorTxt").value = n.horarioTexto || "";
    }

    document.getElementById("nLogoFile").onchange = async (e) => {
      const file = e.target.files[0]; if (!file) return;
      showToast("⏳ Subiendo logo...");
      try { const url = await subirFoto(file, 600); document.getElementById("nLogo").value = url; const prev = document.getElementById("nLogoPrev"); prev.src = url; prev.style.display = "block"; showToast("✅ Logo listo (tocá Guardar Datos abajo)"); }
      catch (err) { showToast("❌ " + err.message, true); }
    };

    document.getElementById("nBannerFile").onchange = async (e) => {
      const file = e.target.files[0]; if (!file) return;
      showToast("⏳ Subiendo portada...");
      try { const url = await subirFoto(file, 1100); document.getElementById("nBanner").value = url; const prev = document.getElementById("nBannerPrev"); prev.src = url; prev.style.display = "block"; showToast("✅ Portada lista (tocá Guardar Datos abajo)"); }
      catch (err) { showToast("❌ " + err.message, true); }
    };

    document.getElementById("btnSaveInfo").onclick = async () => {
      DATA.negocio = {
        ...DATA.negocio, tipo: "tienda",
        nombre: document.getElementById("nNombre").value.trim(), subtitulo: document.getElementById("nSubtitulo").value.trim(),
        logo: document.getElementById("nLogo").value.trim(), banner: document.getElementById("nBanner").value.trim(),
        whatsapp: document.getElementById("nWa").value.trim(), telefonoVisible: document.getElementById("nTelVis").value.trim(),
        direccion: document.getElementById("nDir").value.trim(), instagram: document.getElementById("nIg").value.trim(),
        envioTexto: document.getElementById("nEnvio").value.trim(), horarioTexto: document.getElementById("nHorTxt").value.trim()
      };
      renderTodo(); await guardarEnNube();
    };

    document.querySelectorAll(".estado-btn").forEach(b => {
      b.onclick = async () => { DATA.negocio.estadoModo = b.dataset.estado; renderTodo(); await guardarEnNube(); };
    });
    document.querySelectorAll(".tab-btn").forEach(b => {
      b.onclick = () => {
        document.querySelectorAll(".tab-btn").forEach(x => x.classList.remove("active"));
        document.querySelectorAll(".panel-sec").forEach(x => x.classList.remove("active"));
        b.classList.add("active"); document.getElementById(b.dataset.tab).classList.add("active");
      };
    });
    document.getElementById("admSearch").oninput = renderProds;
    document.getElementById("admFilterCat").onchange = renderProds;
    document.querySelectorAll("[data-close]").forEach(b => { b.onclick = () => document.getElementById(b.dataset.close).classList.remove("open"); });
  </script>
</body>
</html>
